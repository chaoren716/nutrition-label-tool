const DEFAULT_DB=JSON.parse(JSON.stringify(INGREDIENT_DB));
function loadDB(){const saved=localStorage.getItem('ingredient_db');if(saved){try{Object.assign(INGREDIENT_DB,JSON.parse(saved));}catch(e){}}}
loadDB();
function saveDB(){const custom={};for(const[k,v]of Object.entries(INGREDIENT_DB)){if(!DEFAULT_DB[k]||JSON.stringify(v)!==JSON.stringify(DEFAULT_DB[k])){custom[k]=v;}}localStorage.setItem('ingredient_db',JSON.stringify(custom));}
function resetDB(){INGREDIENT_DB=JSON.parse(JSON.stringify(DEFAULT_DB));localStorage.removeItem('ingredient_db');}
let currentFormula={productName:'',bagWeight:15,ingredients:[]};
function loadFormula(){const saved=localStorage.getItem('current_formula');if(saved){try{currentFormula=JSON.parse(saved);}catch(e){}}}
loadFormula();
function saveFormula(){localStorage.setItem('current_formula',JSON.stringify(currentFormula));}
function calcNutrition(){const totals={energy_kj:0,protein:0,fat:0,sat_fat:0,carbs:0,sugar:0,sodium:0,fiber:0};const totalW=currentFormula.bagWeight||15;const missing=[];for(const{name,weight}of currentFormula.ingredients){if(!weight||weight<=0)continue;const ing=INGREDIENT_DB[name];if(!ing){missing.push(name);continue;}const ratio=weight/100;for(const k of Object.keys(totals)){totals[k]+=(ing[k]||0)*ratio;}}const scale=100/totalW;const per100g={};for(const[k,v]of Object.entries(totals)){per100g[k]=Math.round(v*scale*10)/10;}return{per100g,missing};}
function nrvPct(val,key){const n=NRV[key];if(!n)return'-';const pct=Math.round(val/n*100);return pct<1&&val>0?'0%':pct+'%';}
function checkLabelCompliance(){const results=[];const{per100g,missing}=calcNutrition();const ingredients=currentFormula.ingredients.filter(i=>i.weight>0);
const required=['energy_kj','protein','fat','sat_fat','carbs','sugar','sodium'];
const allPresent=required.every(k=>per100g[k]!==undefined);
results.push({item:'7项强制标示完整性',status:allPresent?'pass':'fail',detail:allPresent?'能量、蛋白质、脂肪、饱和脂肪、碳水化合物、糖、钠 均已标示':'缺少强制标示项'});
if(missing.length>0){results.push({item:'原料数据匹配',status:'fail',detail:'以下配料未在数据库中：'+missing.join('、')});}
else{results.push({item:'原料数据匹配',status:'pass',detail:ingredients.length+' 种配料全部匹配'});}
const allergenFound=[];
for(const{name}of ingredients){for(const[cat,info]of Object.entries(ALLERGENS)){if(info.keywords.some(kw=>name.includes(kw))){if(!allergenFound.includes(cat))allergenFound.push(cat);}}}
if(allergenFound.length>0){const names=allergenFound.map(a=>ALLERGENS[a].name).join('、');
results.push({item:'致敏物质提示',status:'warn',detail:'含致敏物质：'+names+'。配料表中应对应原料加粗标示（GB 7718-2025 D.2.1）'});}
else{results.push({item:'致敏物质',status:'pass',detail:'未检出八大类强制致敏物质'});}
const weights=ingredients.map(i=>i.weight);const sorted=[...weights].sort((a,b)=>b-a);
const isSorted=weights.every((w,i)=>w===sorted[i]);
if(!isSorted){results.push({item:'配料排序',status:'warn',detail:'配料未按添加量递减排列（GB 7718 要求）'});}
else{results.push({item:'配料排序',status:'pass',detail:'配料按添加量递减排列'});}
results.push({item:'强制声明语',status:'pass',detail:'需标注："儿童青少年应避免过量摄入盐油糖。"（GB 28050-2025）'});
const warnings=[];
if(per100g.energy_kj>2000)warnings.push('能量'+per100g.energy_kj+'kJ偏高');
if(per100g.fat>30)warnings.push('脂肪'+per100g.fat+'g偏高(NRV>'+nrvPct(per100g.fat,'fat')+')');
if(per100g.sugar>40)warnings.push('糖'+per100g.sugar+'g偏高');
if(per100g.sodium>500)warnings.push('钠'+per100g.sodium+'mg偏高');
if(per100g.sat_fat>10)warnings.push('饱和脂肪'+per100g.sat_fat+'g偏高');
if(warnings.length>0){results.push({item:'NRV% 预警',status:'warn',detail:warnings.join('；')});}
return results;}

function renderLabelPreview(canvasId){const canvas=document.getElementById(canvasId);if(!canvas)return;const ctx=canvas.getContext('2d');const w=600,h=420;canvas.width=w;canvas.height=h;canvas.style.width='100%';canvas.style.height='auto';ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const{per100g}=calcNutrition();const items=[{label:'能量',key:'energy_kj',unit:'kJ',sub:false},{label:'蛋白质',key:'protein',unit:'g',sub:false},{label:'脂肪',key:'fat',unit:'g',sub:false},{label:'饱和脂肪',key:'sat_fat',unit:'g',sub:true},{label:'碳水化合物',key:'carbs',unit:'g',sub:false},{label:'糖',key:'sugar',unit:'g',sub:true},{label:'钠',key:'sodium',unit:'mg',sub:false}];const marginX=40,marginY=40;const colX=[marginX,280,420];const colW=[240,140,140];const rowH=36;ctx.fillStyle='#000';ctx.font='bold 18px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(currentFormula.productName||'产品名称',w/2,marginY-5);ctx.font='bold 16px "Microsoft YaHei",sans-serif';ctx.fillText('营养成分表',w/2,marginY+20);let y=marginY+55;ctx.font='bold 13px "Microsoft YaHei",sans-serif';ctx.textAlign='center';const headerTexts=['项目','每100克','NRV%'];headerTexts.forEach((t,i)=>{ctx.fillText(t,colX[i]+colW[i]/2,y+22);});y+=rowH;ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(marginX,y);ctx.lineTo(w-marginX,y);ctx.stroke();ctx.font='12px "Microsoft YaHei",sans-serif';for(const item of items){y+=rowH;const val=per100g[item.key];const valStr=item.key==='sodium'?Math.round(val)+'':(item.key==='energy_kj'?Math.round(val)+'':(Math.round(val*10)/10).toFixed(1));const nrv=nrvPct(val,item.key);ctx.textAlign='left';ctx.fillStyle='#333';const label=item.sub?'  '+item.label:item.label;ctx.fillText(label,colX[0]+8,y+22);ctx.textAlign='center';ctx.fillText(valStr+' '+item.unit,colX[1]+colW[1]/2,y+22);ctx.fillText(nrv,colX[2]+colW[2]/2,y+22);ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(marginX,y+rowH);ctx.lineTo(w-marginX,y+rowH);ctx.stroke();}y+=rowH+10;ctx.font='10px "Microsoft YaHei",sans-serif';ctx.fillStyle='#888';ctx.textAlign='center';ctx.fillText('儿童青少年应避免过量摄入盐油糖。',w/2,y+10);}
function exportLabelImage(){renderLabelPreview('labelCanvas');const canvas=document.getElementById('labelCanvas');const link=document.createElement('a');link.download=(currentFormula.productName||'营养成分表')+'_标签预览.png';link.href=canvas.toDataURL('image/png');link.click();showToast('图片已导出','success');}

function switchTab(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelector('.nav button[onclick="switchTab(\''+tab+'\')"]').classList.add('active');document.getElementById('panel-'+tab).classList.add('active');if(tab==='formula')renderFormulaPanel();if(tab==='nutrition')renderNutritionPanel();if(tab==='check')renderCheckPanel();}
function showToast(msg,type){const container=document.getElementById('toast-container');const el=document.createElement('div');el.className='toast toast-'+type;el.textContent=msg;container.appendChild(el);setTimeout(function(){el.remove();},2500);}

function renderFormulaPanel(){const panel=document.getElementById('panel-formula');let h='<div class="row"><div class="col"><div class="card"><h3>产品信息</h3><div class="row gap-8"><div class="col"><label>产品名称</label><input type="text" id="productName" value="'+currentFormula.productName+'" onchange="updateProductInfo()" placeholder="如：养肝茶（基础款）"></div><div style="flex:0 0 120px"><label>规格(g/包)</label><input type="number" id="bagWeight" value="'+currentFormula.bagWeight+'" onchange="updateProductInfo()" min="1" max="100"></div><div style="flex:0 0 120px"><label>包/盒</label><input type="number" id="bagsPerBox" value="'+BAGS_PER_BOX+'" min="1" max="100"></div></div></div><div class="card"><div class="flex-between mb-8"><h3 style="margin:0;padding:0;border:none">配料表</h3><div style="display:flex;gap:8px"><label class="btn btn-outline btn-sm" style="cursor:pointer;margin:0">上传Excel<input type="file" accept=".xlsx,.xls" onchange="handleExcelUpload(event)" style="display:none"></label><button class="btn btn-primary btn-sm" onclick="addIngredientRow()">+ 添加配料</button></div></div><div id="ingredientRows"></div><div class="text-right mt-8" style="font-size:13px;color:#888">合计：<span id="totalWeight">0</span>g / <span id="declaredWeight">'+currentFormula.bagWeight+'</span>g<span id="weightCheck" style="margin-left:8px"></span></div></div></div><div class="col"><div class="card"><h3>营养成分表（实时预览）</h3><div id="formulaNutritionPreview"></div></div></div></div>';panel.innerHTML=h;renderIngredientRows();renderFormulaNutritionPreview();}
function updateProductInfo(){currentFormula.productName=document.getElementById('productName').value;currentFormula.bagWeight=parseFloat(document.getElementById('bagWeight').value)||15;saveFormula();renderFormulaNutritionPreview();}
function renderIngredientRows(){const container=document.getElementById('ingredientRows');if(!container)return;const names=Object.keys(INGREDIENT_DB).sort();let h='';currentFormula.ingredients.forEach(function(ing,i){h+='<div class="ingredient-row"><div class="name search-dropdown"><input type="text" value="'+ing.name+'" oninput="searchIngredient(this,'+i+')" onfocus="searchIngredient(this,'+i+')" placeholder="搜索配料..." autocomplete="off"><div class="dropdown" id="dropdown-'+i+'"></div></div><div class="weight"><input type="number" value="'+ing.weight+'" onchange="updateIngredientWeight('+i+',this.value)" step="0.1" min="0" placeholder="克重"></div><div class="actions"><button class="btn btn-danger btn-sm" onclick="removeIngredient('+i+')">x</button></div></div>';});if(currentFormula.ingredients.length===0){h='<div style="text-align:center;color:#999;padding:20px">点击"+ 添加配料"或上传 Excel 开始</div>';}container.innerHTML=h;updateTotalWeight();}
function addIngredientRow(name,weight){currentFormula.ingredients.push({name:name||'',weight:weight||0});saveFormula();renderIngredientRows();renderFormulaNutritionPreview();}
function removeIngredient(i){currentFormula.ingredients.splice(i,1);saveFormula();renderIngredientRows();renderFormulaNutritionPreview();}
function updateIngredientWeight(i,w){currentFormula.ingredients[i].weight=parseFloat(w)||0;saveFormula();updateTotalWeight();renderFormulaNutritionPreview();}
function updateTotalWeight(){const total=currentFormula.ingredients.reduce(function(s,i){return s+(i.weight||0);},0);const el=document.getElementById('totalWeight');if(el)el.textContent=total.toFixed(1);const check=document.getElementById('weightCheck');if(check){const declared=currentFormula.bagWeight;if(Math.abs(total-declared)>0.1){check.innerHTML='<span style="color:#d93025">偏差'+Math.abs(total-declared).toFixed(1)+'g</span>';}else if(total>0){check.innerHTML='<span style="color:#0d652d">重量一致</span>';}else{check.innerHTML='';}}}
function searchIngredient(input,i){const val=input.value.toLowerCase();const dropdown=document.getElementById('dropdown-'+i);if(!dropdown)return;const names=Object.keys(INGREDIENT_DB).filter(function(n){return n.toLowerCase().includes(val);}).slice(0,15);if(names.length===0||val===''){dropdown.classList.remove('show');return;}dropdown.classList.add('show');dropdown.innerHTML=names.map(function(n){const src=INGREDIENT_DB[n].source;const tag=src==='CFCT-6'?'<span class="tag tag-cfct">CFCT-6</span>':(src==='LIT'?'<span class="tag tag-lit">LIT</span>':(src==='LABEL'?'<span class="tag tag-label">LABEL</span>':'<span class="tag tag-est">EST</span>'));return '<div class="dropdown-item" onclick="selectIngredient('+i+',\''+n+'\')">'+n+' '+tag+'</div>';}).join('');}
function selectIngredient(i,name){currentFormula.ingredients[i].name=name;saveFormula();renderIngredientRows();renderFormulaNutritionPreview();}

function handleExcelUpload(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws,{header:1});parseExcelData(data);}catch(err){showToast('Excel解析失败：'+err.message,'error');}};reader.readAsArrayBuffer(file);}
function parseExcelData(data){const products=[];let currentProduct=null;for(let r=0;r<data.length;r++){const row=data[r];if(!row||row.length===0)continue;const firstCell=String(row[0]||'').trim();if(firstCell&&!firstCell.match(/^\d+$/)&&firstCell!=='序号'){if(firstCell.includes('茶')||firstCell.includes('（')){if(currentProduct&&currentProduct.ingredients.length>0){products.push(currentProduct);}currentProduct={name:firstCell,bagWeight:15,ingredients:[]};continue;}}if(currentProduct&&row[1]&&row[3]){const name=String(row[1]).trim();const weight=parseFloat(row[3]);if(name&&!isNaN(weight)&&weight>0){if(name==='总重量'||name.includes('总重量')){currentProduct.bagWeight=weight;}else if(!name.includes('规格')&&!name.includes('工艺')&&!name.includes('成本')){currentProduct.ingredients.push({name:name,weight:weight});}}}}if(currentProduct&&currentProduct.ingredients.length>0){products.push(currentProduct);}if(products.length===0){showToast('未识别到产品配方数据，请检查Excel格式','error');return;}if(products.length>1){showProductSelector(products);}else{loadProduct(products[0]);}}
function showProductSelector(products){const modal=document.getElementById('modal-container');let h='<div class="modal-overlay" onclick="this.parentElement.innerHTML=\'\'"><div class="modal" onclick="event.stopPropagation()"><h3>识别到 '+products.length+' 款产品，请选择导入</h3>';products.forEach(function(p,i){h+='<div class="card" style="cursor:pointer" onclick="loadProduct(products['+i+']);document.getElementById(\'modal-container\').innerHTML=\'\'"><strong>'+p.name+'</strong><span style="color:#888;margin-left:8px">'+p.ingredients.length+'种配料 '+p.bagWeight+'g/包</span></div>';});h+='<div class="modal-actions"><button class="btn btn-outline" onclick="document.getElementById(\'modal-container\').innerHTML=\'\'">取消</button></div></div></div>';modal.innerHTML=h;}
function loadProduct(product){currentFormula.productName=product.name;currentFormula.bagWeight=product.bagWeight;currentFormula.ingredients=product.ingredients;saveFormula();renderFormulaPanel();showToast('已导入：'+product.name+' ('+product.ingredients.length+'种配料)','success');}

function renderNutritionPanel(){const panel=document.getElementById('panel-nutrition');const{per100g,missing}=calcNutrition();const bag=currentFormula.bagWeight;const box=bag*BAGS_PER_BOX;const items=[{label:'能量',key:'energy_kj',unit:'kJ',sub:false},{label:'蛋白质',key:'protein',unit:'g',sub:false},{label:'脂肪',key:'fat',unit:'g',sub:false},{label:'饱和脂肪',key:'sat_fat',unit:'g',sub:true},{label:'碳水化合物',key:'carbs',unit:'g',sub:false},{label:'糖',key:'sugar',unit:'g',sub:true},{label:'钠',key:'sodium',unit:'mg',sub:false}];let h='<div class="row"><div class="col"><div class="card"><div class="flex-between mb-8"><h3 style="margin:0;padding:0;border:none">'+(currentFormula.productName||'（未命名产品）')+'</h3><span style="font-size:13px;color:#888">'+bag+'g/包 x '+BAGS_PER_BOX+'包/盒 = '+box+'g/盒</span></div><table class="nutrition-table"><thead><tr><th>项目</th><th>每100克</th><th>NRV%</th><th>每包('+bag+'g)</th><th>每盒('+box+'g)</th></tr></thead><tbody>';for(const item of items){const val=per100g[item.key];const rowClass=item.sub?'sub':'';const nrvVal=nrvPct(val,item.key);const nrvNum=parseInt(nrvVal);let warnClass='';if(nrvNum>30&&(item.key==='energy_kj'||item.key==='fat'||item.key==='carbs'))warnClass='warn';if(nrvNum>20&&item.key==='sodium')warnClass='warn';if(nrvNum>10&&item.key==='sat_fat')warnClass='warn';const val100=item.key==='sodium'?Math.round(val):(item.key==='energy_kj'?Math.round(val):(Math.round(val*10)/10).toFixed(1));const valBag=item.key==='sodium'?Math.round(val*bag/100):(item.key==='energy_kj'?Math.round(val*bag/100):(Math.round(val*bag/10)/10).toFixed(1));const valBox=item.key==='sodium'?Math.round(val*box/100):(item.key==='energy_kj'?Math.round(val*box/100):(Math.round(val*box/10)/10).toFixed(1));h+='<tr class="'+rowClass+' '+warnClass+'"><td style="text-align:left">'+(item.sub?'&nbsp;&nbsp;':'')+item.label+'</td><td>'+val100+' '+item.unit+'</td><td>'+nrvVal+'</td><td>'+valBag+' '+item.unit+'</td><td>'+valBox+' '+item.unit+'</td></tr>';}h+='<tr><td colspan="5" class="mandatory">儿童青少年应避免过量摄入盐油糖。</td></tr></tbody></table>';if(missing.length>0){h+='<div style="color:#d93025;font-size:13px;margin-top:8px">缺失数据：'+missing.join('、')+'</div>';}h+='</div></div><div class="col"><div class="card"><div class="flex-between mb-8"><h3 style="margin:0;padding:0;border:none">标签预览</h3><button class="btn btn-primary btn-sm" onclick="exportLabelImage()">导出图片</button></div><canvas id="labelCanvas" class="preview-canvas"></canvas></div></div></div>';panel.innerHTML=h;setTimeout(function(){renderLabelPreview('labelCanvas');},100);}
function renderFormulaNutritionPreview(){const container=document.getElementById('formulaNutritionPreview');if(!container)return;const{per100g,missing}=calcNutrition();const items=[{label:'能量',key:'energy_kj',unit:'kJ',sub:false},{label:'蛋白质',key:'protein',unit:'g',sub:false},{label:'脂肪',key:'fat',unit:'g',sub:false},{label:'饱和脂肪',key:'sat_fat',unit:'g',sub:true},{label:'碳水化合物',key:'carbs',unit:'g',sub:false},{label:'糖',key:'sugar',unit:'g',sub:true},{label:'钠',key:'sodium',unit:'mg',sub:false}];let h='<table class="nutrition-table"><thead><tr><th>项目</th><th>每100克</th><th>NRV%</th></tr></thead><tbody>';for(const item of items){const val=per100g[item.key];const rowClass=item.sub?'sub':'';const nrvVal=nrvPct(val,item.key);const nrvNum=parseInt(nrvVal);let warnClass='';if(nrvNum>30)warnClass='warn';const valStr=item.key==='sodium'?Math.round(val):(item.key==='energy_kj'?Math.round(val):(Math.round(val*10)/10).toFixed(1));h+='<tr class="'+rowClass+' '+warnClass+'"><td style="text-align:left">'+(item.sub?'&nbsp;&nbsp;':'')+item.label+'</td><td>'+valStr+' '+item.unit+'</td><td>'+nrvVal+'</td></tr>';}h+='<tr><td colspan="3" class="mandatory">儿童青少年应避免过量摄入盐油糖。</td></tr></tbody></table>';if(missing.length>0){h+='<div style="color:#d93025;font-size:12px;margin-top:4px">缺失：'+missing.join('、')+'</div>';}container.innerHTML=h;}

function renderCheckPanel(){const panel=document.getElementById('panel-check');const results=checkLabelCompliance();let h='<div class="card"><h3>标签合规检查 - '+(currentFormula.productName||'当前产品')+'</h3><ul class="check-list">';for(const r of results){const icon=r.status==='pass'?'OK':(r.status==='warn'?'!!':'XX');h+='<li class="'+r.status+'"><strong>'+icon+' '+r.item+'</strong>：'+r.detail+'</li>';}h+='</ul>';const passCount=results.filter(function(r){return r.status==='pass';}).length;const warnCount=results.filter(function(r){return r.status==='warn';}).length;const failCount=results.filter(function(r){return r.status==='fail';}).length;h+='<div style="margin-top:12px;padding:12px;background:#f5f5f5;border-radius:6px;font-size:13px"><strong>检查结果：</strong><span style="color:#0d652d">OK '+passCount+' 项通过</span>';if(warnCount>0)h+=' <span style="color:#7a5d00">!! '+warnCount+' 项预警</span>';if(failCount>0)h+=' <span style="color:#c5221f">XX '+failCount+' 项不通过</span>';h+='</div></div>';panel.innerHTML=h;}

function showDBManager(){const modal=document.getElementById('modal-container');const names=Object.keys(INGREDIENT_DB).sort();let h='<div class="modal-overlay"><div class="modal" style="max-width:800px;width:95%"><div class="flex-between mb-16"><h3 style="margin:0">原料数据库管理</h3><div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" onclick="showAddIngredientForm()">+ 新增原料</button><button class="btn btn-outline btn-sm" onclick="if(confirm(\'确认恢复默认数据库？所有自定义修改将丢失。\')){resetDB();loadDB();showDBManager();showToast(\'已恢复默认数据库\',\'info\')}">恢复默认</button><button class="btn btn-sm" onclick="document.getElementById(\'modal-container\').innerHTML=\'\'" style="background:#ddd">关闭</button></div></div><input type="text" placeholder="搜索原料..." oninput="filterDBTable(this.value)" style="margin-bottom:12px"><div style="max-height:50vh;overflow-y:auto"><table class="nutrition-table" id="dbTable"><thead><tr><th>原料名称</th><th>来源</th><th>能量kJ</th><th>蛋白质g</th><th>脂肪g</th><th>碳水g</th><th>糖g</th><th>钠mg</th><th>操作</th></tr></thead><tbody>';for(const name of names){const ing=INGREDIENT_DB[name];const isCustom=!DEFAULT_DB[name];const isModified=DEFAULT_DB[name]&&JSON.stringify(ing)!==JSON.stringify(DEFAULT_DB[name]);let srcClass=ing.source==='CFCT-6'?'tag-cfct':(ing.source==='LIT'?'tag-lit':(ing.source==='LABEL'?'tag-label':'tag-est'));let marker='';if(isCustom)marker=' <span style="color:#1a73e8;font-size:10px">[自定义]</span>';if(isModified)marker=' <span style="color:#e37400;font-size:10px">[已修改]</span>';h+='<tr data-name="'+name+'"><td style="text-align:left">'+name+marker+'</td><td><span class="tag '+srcClass+'">'+ing.source+'</span></td><td>'+ing.energy_kj+'</td><td>'+ing.protein+'</td><td>'+ing.fat+'</td><td>'+ing.carbs+'</td><td>'+ing.sugar+'</td><td>'+ing.sodium+'</td><td><button class="btn btn-outline btn-sm" onclick="editIngredient(\''+name+'\')">编辑</button></td></tr>';}h+='</tbody></table></div></div></div>';modal.innerHTML=h;}
function filterDBTable(query){const rows=document.querySelectorAll('#dbTable tbody tr');rows.forEach(function(row){const name=row.getAttribute('data-name')||'';row.style.display=name.toLowerCase().includes(query.toLowerCase())?'':'none';});}
function showAddIngredientForm(){const modal=document.getElementById('modal-container');modal.innerHTML='<div class="modal-overlay"><div class="modal"><h3>新增原料</h3><div class="row"><div class="col"><label>原料名称</label><input type="text" id="newIngName" placeholder="如：霍山石斛茎"></div><div class="col"><label>数据来源</label><select id="newIngSource"><option value="LIT">LIT（文献）</option><option value="LABEL">LABEL（标签）</option><option value="EST">EST（估算）</option><option value="CFCT-6">CFCT-6</option></select></div></div><div class="row mt-8"><div class="col"><label>能量(kJ)</label><input type="number" id="newIngEnergy" step="1"></div><div class="col"><label>蛋白质(g)</label><input type="number" id="newIngProtein" step="0.1"></div><div class="col"><label>脂肪(g)</label><input type="number" id="newIngFat" step="0.1"></div></div><div class="row mt-8"><div class="col"><label>饱和脂肪(g)</label><input type="number" id="newIngSatFat" step="0.1"></div><div class="col"><label>碳水化合物(g)</label><input type="number" id="newIngCarbs" step="0.1"></div><div class="col"><label>糖(g)</label><input type="number" id="newIngSugar" step="0.1"></div></div><div class="row mt-8"><div class="col"><label>膳食纤维(g)</label><input type="number" id="newIngFiber" step="0.1"></div><div class="col"><label>钠(mg)</label><input type="number" id="newIngSodium" step="0.1"></div></div><div class="modal-actions"><button class="btn btn-outline" onclick="showDBManager()">取消</button><button class="btn btn-primary" onclick="addNewIngredient()">确认添加</button></div></div></div>';}
function addNewIngredient(){const name=document.getElementById('newIngName').value.trim();if(!name){showToast('请输入原料名称','error');return;}if(INGREDIENT_DB[name]&&!confirm('原料"'+name+'"已存在，是否覆盖？'))return;INGREDIENT_DB[name]={source:document.getElementById('newIngSource').value,sourceDetail:'用户自定义',energy_kj:parseFloat(document.getElementById('newIngEnergy').value)||0,protein:parseFloat(document.getElementById('newIngProtein').value)||0,fat:parseFloat(document.getElementById('newIngFat').value)||0,sat_fat:parseFloat(document.getElementById('newIngSatFat').value)||0,carbs:parseFloat(document.getElementById('newIngCarbs').value)||0,sugar:parseFloat(document.getElementById('newIngSugar').value)||0,fiber:parseFloat(document.getElementById('newIngFiber').value)||0,sodium:parseFloat(document.getElementById('newIngSodium').value)||0};saveDB();showDBManager();showToast('已添加原料：'+name,'success');}
function editIngredient(name){const ing=INGREDIENT_DB[name];const modal=document.getElementById('modal-container');modal.innerHTML='<div class="modal-overlay"><div class="modal"><h3>编辑原料：'+name+'</h3><div class="row"><div class="col"><label>数据来源</label><select id="editIngSource"><option value="CFCT-6"'+(ing.source==='CFCT-6'?' selected':'')+'>CFCT-6</option><option value="LIT"'+(ing.source==='LIT'?' selected':'')+'>LIT</option><option value="LABEL"'+(ing.source==='LABEL'?' selected':'')+'>LABEL</option><option value="EST"'+(ing.source==='EST'?' selected':'')+'>EST</option></select></div></div><div class="row mt-8"><div class="col"><label>能量(kJ)</label><input type="number" id="editIngEnergy" value="'+ing.energy_kj+'" step="1"></div><div class="col"><label>蛋白质(g)</label><input type="number" id="editIngProtein" value="'+ing.protein+'" step="0.1"></div><div class="col"><label>脂肪(g)</label><input type="number" id="editIngFat" value="'+ing.fat+'" step="0.1"></div></div><div class="row mt-8"><div class="col"><label>饱和脂肪(g)</label><input type="number" id="editIngSatFat" value="'+ing.sat_fat+'" step="0.1"></div><div class="col"><label>碳水化合物(g)</label><input type="number" id="editIngCarbs" value="'+ing.carbs+'" step="0.1"></div><div class="col"><label>糖(g)</label><input type="number" id="editIngSugar" value="'+ing.sugar+'" step="0.1"></div></div><div class="row mt-8"><div class="col"><label>膳食纤维(g)</label><input type="number" id="editIngFiber" value="'+ing.fiber+'" step="0.1"></div><div class="col"><label>钠(mg)</label><input type="number" id="editIngSodium" value="'+ing.sodium+'" step="0.1"></div></div><div class="modal-actions"><button class="btn btn-danger" onclick="deleteIngredient(\''+name+'\')">删除</button><button class="btn btn-outline" onclick="showDBManager()">取消</button><button class="btn btn-primary" onclick="saveIngredientEdit(\''+name+'\')">保存</button></div></div></div>';}
function saveIngredientEdit(name){INGREDIENT_DB[name]={...INGREDIENT_DB[name],source:document.getElementById('editIngSource').value,energy_kj:parseFloat(document.getElementById('editIngEnergy').value)||0,protein:parseFloat(document.getElementById('editIngProtein').value)||0,fat:parseFloat(document.getElementById('editIngFat').value)||0,sat_fat:parseFloat(document.getElementById('editIngSatFat').value)||0,carbs:parseFloat(document.getElementById('editIngCarbs').value)||0,sugar:parseFloat(document.getElementById('editIngSugar').value)||0,fiber:parseFloat(document.getElementById('editIngFiber').value)||0,sodium:parseFloat(document.getElementById('editIngSodium').value)||0};saveDB();showDBManager();showToast('已更新：'+name,'success');}
function deleteIngredient(name){if(!confirm('确认删除原料"'+name+'"？'))return;delete INGREDIENT_DB[name];saveDB();showDBManager();showToast('已删除：'+name,'info');}

document.addEventListener('DOMContentLoaded',function(){renderFormulaPanel();document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey){if(e.key==='1'){e.preventDefault();switchTab('formula');}if(e.key==='2'){e.preventDefault();switchTab('nutrition');}if(e.key==='3'){e.preventDefault();switchTab('check');}if(e.key==='s'){e.preventDefault();saveFormula();showToast('配方已保存','success');}if(e.key==='e'){e.preventDefault();exportLabelImage();}}});});
document.addEventListener('click',function(e){if(!e.target.closest('.search-dropdown')){document.querySelectorAll('.dropdown').forEach(function(d){d.classList.remove('show');});}});
</script>
</parameter>

</script>
