th,td{padding:10px 12px;text-align:center;border:1px solid #ddd;font-size:14px}
th{background:#f5f5f5;font-weight:700;color:#1a365d}

td.warn{background:#fff3cd;color:#8b5108;font-weight:700}
td.bad{background:#fff1f0;color:#cf1322;font-weight:700}

.toast-ok{background:#135c3f}.toast-err{background:#cf1322}.toast-info{background:#1a365d}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.rel{position:relative}
.hide{display:none}

function calc() {
  var t = {e:0,p:0,f:0,sf:0,c:0,sg:0,na:0,fb:0};
  var m = [];
  var tw = formula.bag || 15;
  for (var i = 0; i < formula.items.length; i++) {
    var it = formula.items[i];
    if (!it.w || it.w <= 0) continue;
    var ing = INGREDIENT_DB[it.n];
    if (!ing) { m.push(it.n); continue; }
    var r = it.w / 100;
    t.e += ing.energy_kj * r;
    t.p += ing.protein * r;
    t.f += ing.fat * r;
    t.sf += ing.sat_fat * r;
    t.c += ing.carbs * r;
    t.sg += ing.sugar * r;
    t.na += ing.sodium * r;
    t.fb += ing.fiber * r;
  }
  var s = 100 / tw;
  var r = {};
  for (var k in t) { r[k] = Math.round(t[k] * s * 10) / 10; }
  return {per100: r, missing: m};
}

  if (key === 'na' || key === 'e') return Math.round(val) + '';
  return (Math.round(val * 10) / 10).toFixed(1);
}

function nrvPct(val, key) {
  var nrv = NRV[key];
  if (!nrv) return '-';
  var p = Math.round(val / nrv * 100);
  return p < 1 && val > 0 ? '0%' : p + '%';
}

var NUTS = [
  {label:'能量', key:'e', unit:'kJ'},
  {label:'蛋白质', key:'p', unit:'g'},
  {label:'脂肪', key:'f', unit:'g'},
  {label:'饱和脂肪', key:'sf', unit:'g', sub:true},
  {label:'碳水化合物', key:'c', unit:'g'},
  {label:'糖', key:'sg', unit:'g', sub:true},
  {label:'钠', key:'na', unit:'mg'},
];

function nutTable(per100, bagW) {
  var h = '<table><thead><tr><th>项目</th><th>每100克</th><th>NRV%</th>';
  if (bagW) h += '<th>每包('+bagW+'g)</th><th>每盒('+(bagW*BAGS)+'g)</th>';
  h += '</tr></thead><tbody>';
  for (var i = 0; i < NUTS.length; i++) {
    var it = NUTS[i];
    var v = per100[it.key];
    var vs = fmt(v, it.key);
    var nr = nrvPct(v, it.key);
    var rn = parseInt(nr);
    var wc = (rn > 30 && (it.key === 'e' || it.key === 'f' || it.key === 'c')) ? 'warn' : '';
    if (rn > 20 && it.key === 'na') wc = 'warn';
    h += '<tr><td class="l' + (it.sub ? ' td-sub' : '') + '">' + it.label + '</td>';
    h += '<td>' + vs + ' ' + it.unit + '</td>';
    h += '<td class="' + wc + '">' + nr + '</td>';
    if (bagW) {
      var vb = v * bagW / 100;
      var vx = v * bagW * BAGS / 100;
      h += '<td>' + fmt(vb, it.key) + ' ' + it.unit + '</td>';
      h += '<td>' + fmt(vx, it.key) + ' ' + it.unit + '</td>';
    }
    h += '</tr>';
  }
  h += '<tr><td colspan="' + (bagW ? 5 : 3) + '" style="font-size:11px;color:#888;text-align:left">儿童青少年应避免过量摄入盐油糖。</td></tr>';
  h += '</tbody></table>';
  return h;
}

// Excel 上传
function handleXLS(e) {
  var f = e.target.files[0];
  if (!f) return;
  loadSheetJS(function(ok) {
    if (!ok) { toast('Excel组件加载失败，请检查网络', 'err'); return; }
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var wb = XLSX.read(ev.target.result, {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var data = XLSX.utils.sheet_to_json(ws, {header:1});
        parseXLS(data);
      } catch(err) { toast('解析失败：'+err.message, 'err'); }
    };
    reader.readAsArrayBuffer(f);
  });
}

function parseXLS(data) {
  var products = [], cur = null;
  for (var r = 0; r < data.length; r++) {
    var row = data[r];
    if (!row || !row.length) continue;
    var c0 = String(row[0] || '').trim();
    if (c0 && !c0.match(/^\d+$/) && c0 !== '序号') {
      if (c0.indexOf('茶') >= 0 || c0.indexOf('（') >= 0) {
        if (cur && cur.items.length > 0) products.push(cur);
        cur = {name: c0, bag: 15, items: []};
        continue;
      }
    }
    if (cur && row[1] && row[3]) {
      var n = String(row[1]).trim();
      var w = parseFloat(row[3]);
      if (n && !isNaN(w) && w > 0) {
        if (n === '总重量' || n.indexOf('总重量') >= 0) cur.bag = w;
        else if (n.indexOf('规格') < 0 && n.indexOf('工艺') < 0 && n.indexOf('成本') < 0) {
          cur.items.push({n: n, w: w});
        }
      }
    }
  }
  if (cur && cur.items.length > 0) products.push(cur);
  if (products.length === 0) { toast('未识别到配方数据', 'err'); return; }
  if (products.length === 1) {
    formula = products[0]; saveFormula(); buildTab1(); toast('已导入：'+formula.name, 'ok');
  } else {
    showProductPicker(products);
  }
}

function showProductPicker(products) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:998;display:flex;align-items:center;justify-content:center';
  var modal = document.createElement('div');
  modal.style.cssText = 'background:#fff;border-radius:8px;padding:24px;max-width:500px;width:90%;max-height:70vh;overflow-y:auto';
  modal.innerHTML = '<h3 style="margin-bottom:16px">识别到 ' + products.length + ' 款产品</h3>';

      card.style.cssText = 'padding:12px;border:1px solid #ddd;border-radius:6px;margin-bottom:8px;cursor:pointer';
      card.innerHTML = '<strong>' + p.name + '</strong> <span style="color:#888">' + p.items.length + '种配料 · ' + p.bag + 'g/包</span>';
      card.addEventListener('click', function() {

        overlay.remove();
        toast('已导入：'+p.name, 'ok');
      });
      modal.appendChild(card);
    })(products[i], i);
  }
  modal.innerHTML += '<div style="text-align:right;margin-top:12px"><button class="btn-outline btn-sm" id="cancel-pick">取消</button></div>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  document.getElementById('cancel-pick').addEventListener('click', function() { overlay.remove(); });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

// CDN 动态加载
var CDN = {};
function loadCDN(url, key) {
  if (CDN[key]) return Promise.resolve(true);
  if (key === 'sheetjs' && typeof XLSX !== 'undefined') { CDN[key] = true; return Promise.resolve(true); }
  if (key === 'tesseract' && typeof Tesseract !== 'undefined') { CDN[key] = true; return Promise.resolve(true); }
  return new Promise(function(resolve) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = function() { CDN[key] = true; resolve(true); };
    s.onerror = function() { resolve(false); };
    document.head.appendChild(s);
  });
}
function loadSheetJS(cb) { loadCDN('https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js', 'sheetjs').then(cb); }
function loadTesseract(cb) { loadCDN('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js', 'tesseract').then(cb); }

function drawPreview(canvasId) {
  var canvas = document.getElementById(canvasId);

  var ctx = canvas.getContext('2d');

  canvas.width = w; canvas.height = h;

  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  var c = calc();

  ctx.fillStyle = '#000';
  ctx.font = 'bold 18px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(formula.name || '产品名称', w/2, 35);
  ctx.font = 'bold 16px "Microsoft YaHei",sans-serif';

  var y = 90;
  ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
  ['项目', '每100克', 'NRV%'].forEach(function(t, i) {
    ctx.fillText(t, [40, 280, 420][i] + [240, 140, 140][i]/2, y + 20);
  });

  y += 34;
  ctx.strokeStyle = '#333'; ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(w-40, y); ctx.stroke();

  ctx.font = '12px "Microsoft YaHei",sans-serif';
  for (var i = 0; i < NUTS.length; i++) {
    y += 32;
    var it = NUTS[i];
    var v = per[it.key];
    var vs = it.key === 'na' ? Math.round(v) + '' : (it.key === 'e' ? Math.round(v) + '' : v.toFixed(1));
    var nr = nrvPct(v, it.key);
    ctx.textAlign = 'left'; ctx.fillStyle = '#333';
    ctx.fillText((it.sub ? '  ' : '') + it.label, 48, y + 20);
    ctx.textAlign = 'center';
    ctx.fillText(vs + ' ' + it.unit, 350, y + 20);
    ctx.fillText(nr, 490, y + 20);
    ctx.strokeStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(40, y + 32); ctx.lineTo(w-40, y + 32); ctx.stroke();
  }

  y += 48;
  ctx.font = '10px "Microsoft YaHei",sans-serif'; ctx.fillStyle = '#888'; ctx.textAlign = 'center';
  ctx.fillText('儿童青少年应避免过量摄入盐油糖。', w/2, y);
}

// ═══════ Tab 3: 标签检查 ═══════
var ALLERGENS = {
  soy: ['黑豆','黄豆','大豆','豆粕','豆腐','豆浆','酱油'],
  nuts: ['核桃','杏仁','腰果','榛子','松子','开心果','夏威夷果']
};

function buildTab3() {
  var el = document.getElementById('tab3');
  el.innerHTML = '';
  var c = calc();
  var per = c.per100;
  var items = formula.items.filter(function(x) { return x.w > 0; });
  var results = [];

  // 7项检查
  results.push({ok: true, text: '7项强制标示（能量、蛋白质、脂肪、饱和脂肪、碳水化合物、糖、钠）完整'});

  // 原料匹配
  if (c.missing.length > 0) {
    results.push({ok: false, text: '原料未匹配：' + c.missing.join('、')});
  } else {
    results.push({ok: true, text: items.length + ' 种配料全部匹配数据库'});
  }

  // 致敏物质
  var allergens = [];
  for (var i = 0; i < items.length; i++) {
    for (var cat in ALLERGENS) {
      for (var j = 0; j < ALLERGENS[cat].length; j++) {
        if (items[i].n.indexOf(ALLERGENS[cat][j]) >= 0) {
          if (allergens.indexOf(cat) < 0) allergens.push(cat);
        }
      }
    }
  }
  if (allergens.length > 0) {
    results.push({ok: false, text: '含致敏物质：配料表中对应原料需加粗标示（GB 7718-2025）'});
  } else {
    results.push({ok: true, text: '未检出强制致敏物质'});
  }

  // 配料排序
  var weights = items.map(function(x) { return x.w; });
  var sorted = weights.slice().sort(function(a, b) { return b - a; });
  var isSorted = weights.every(function(w, i) { return w === sorted[i]; });
  results.push({ok: isSorted, text: isSorted ? '配料按添加量递减排列' : '配料未按添加量递减排列（GB 7718要求）'});

  // 强制声明语
  results.push({ok: true, text: '需标注："儿童青少年应避免过量摄入盐油糖。"'});

  // 数值预警
  if (per.e > 2000) results.push({ok: false, text: '能量' + per.e + 'kJ 偏高'});
  if (per.f > 30) results.push({ok: false, text: '脂肪' + per.f + 'g 偏高 (NRV ' + nrvPct(per.f, 'f') + ')'});
  if (per.sg > 40) results.push({ok: false, text: '糖' + per.sg + 'g 偏高'});
  if (per.na > 500) results.push({ok: false, text: '钠' + per.na + 'mg 偏高'});

  // 渲染
  var b = document.createElement('div'); b.className = 'box';
  b.innerHTML = '<h3>标签合规检查 — ' + (formula.name || '当前产品') + '</h3>';
  var ul = document.createElement('ul'); ul.style.cssText = 'list-style:none;padding:0';
  var pass = 0, fail = 0;
  for (var i = 0; i < results.length; i++) {
    var li = document.createElement('li');
    li.style.cssText = 'padding:8px 12px;margin:4px 0;border-radius:4px;font-size:13px;border-left:4px solid ' + (results[i].ok ? '#135c3f' : '#cf1322');
    li.style.background = results[i].ok ? '#f0faf4' : '#fff1f0';
    li.style.color = results[i].ok ? '#135c3f' : '#a80d1a';
    li.textContent = (results[i].ok ? '✓ ' : '✗ ') + results[i].text;
    ul.appendChild(li);
    if (results[i].ok) pass++; else fail++;
  }
  b.appendChild(ul);
  b.innerHTML += '<div style="margin-top:12px;padding:8px 12px;background:#f5f5f5;border-radius:4px;font-size:13px">';
  b.innerHTML += '通过 <b style="color:#135c3f">' + pass + '</b> 项';
  if (fail > 0) b.innerHTML += '，不通过 <b style="color:#cf1322">' + fail + '</b> 项';
  b.innerHTML += '</div>';
  el.appendChild(b);
}

  var tbody = table.querySelector('#review-tbody');

  for (var i = 0; i < NUTS.length; i++) {
    var it = NUTS[i];
    var cv = c.per100[it.key];
    var cvs = fmt(cv, it.key);
    var ov = (reviewOcr && reviewOcr[it.key] !== null) ? reviewOcr[it.key] : '';

    var tr = document.createElement('tr');
    tr.innerHTML = '<td class="l">' + it.label + '</td>' +
      '<td>' + cvs + ' ' + it.unit + '</td>' +
      '<td><input type="text" id="rv-' + it.key + '" value="' + ov + '" placeholder="输入标签值" style="width:100px"> <span style="font-size:11px;color:#888">' + it.unit + '</span></td>' +
      '<td id="rv-st-' + it.key + '" style="font-size:12px">-</td>';
    tbody.appendChild(tr);

    // 绑定输入事件
    document.getElementById('rv-' + it.key).addEventListener('input', doCompare);
  }
  b2.appendChild(table);

  var btnCompare = document.createElement('button');
  btnCompare.textContent = '执行审核对比'; btnCompare.className = 'btn-green';
  btnCompare.style.cssText = 'width:100%;margin-top:12px;justify-content:center';
  btnCompare.addEventListener('click', doCompare);
  b2.appendChild(btnCompare);

  var resultDiv = document.createElement('div'); resultDiv.id = 'review-result'; resultDiv.style.marginTop = '16px';
  b2.appendChild(resultDiv);
  el.appendChild(b2);

  // 绑定文件事件
  document.getElementById('review-file').addEventListener('change', function(e) {
    var f = e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(ev) { reviewImage = ev.target.result; reviewOcr = null; buildTab4(); };
    reader.readAsDataURL(f);
  });

  if (document.getElementById('btn-change-img')) {
    document.getElementById('btn-change-img').addEventListener('click', function(e) {
      e.stopPropagation();
      document.getElementById('review-file').click();
    });
  }

  if (document.getElementById('btn-ocr')) {
    document.getElementById('btn-ocr').addEventListener('click', runOCR);
  }

  if (reviewOcr) doCompare();
}

function runOCR() {
  var btn = document.getElementById('btn-ocr');
  var st = document.getElementById('ocr-status');
  btn.disabled = true; btn.textContent = '加载引擎...';
  st.textContent = '';

  loadTesseract(function(ok) {
    if (!ok) { st.textContent = '加载失败，请手动输入'; btn.disabled = false; btn.textContent = '重试'; return; }
    st.textContent = '初始化中文识别...';
    Tesseract.createWorker('chi_sim', 1, {
      logger: function(m) {
        if (m.status === 'recognizing text') st.textContent = '识别中...' + Math.round(m.progress * 100) + '%';
        else st.textContent = m.status;
      }
    }).then(function(worker) {
      return worker.recognize(reviewImage).then(function(result) {
        worker.terminate();
        reviewOcr = parseOCR(result.data.text);
        btn.textContent = '重新识别'; btn.disabled = false;
        st.textContent = '识别完成，已提取 ' + Object.values(reviewOcr).filter(function(v) { return v !== null; }).length + '/7 项';
        // 填充输入框
        for (var k in reviewOcr) {
          if (reviewOcr[k] !== null) {
            var inp = document.getElementById('rv-' + k);
            if (inp) inp.value = reviewOcr[k];
          }
        }
        doCompare();
      });
    }).catch(function(err) {
      st.textContent = '识别失败：' + err.message;
      btn.disabled = false; btn.textContent = '重试';
    });
  });
}

function parseOCR(text) {
  var r = {e:null, p:null, f:null, sf:null, c:null, sg:null, na:null};
  var patterns = {
    e: [/能量\s*[：:]*\s*(\d+\.?\d*)\s*(?:kJ|kj|KJ|千焦)/i, /(\d+\.?\d*)\s*kJ/i],
    p: [/蛋白质\s*[：:]*\s*(\d+\.?\d*)\s*g/i],
    f: [/脂肪\s*[：:]*\s*(\d+\.?\d*)\s*g/i],
    sf: [/饱和脂肪[酸]?\s*[：:]*\s*(\d+\.?\d*)\s*g/i],
    c: [/碳水化合物\s*[：:]*\s*(\d+\.?\d*)\s*g/i],
    sg: [/糖\s*[：:]*\s*(\d+\.?\d*)\s*g/i],
    na: [/钠\s*[：:]*\s*(\d+\.?\d*)\s*mg/i]
  };
  for (var k in patterns) {
    for (var i = 0; i < patterns[k].length; i++) {
      var m = text.match(patterns[k][i]);
      if (m) { r[k] = parseFloat(m[1]); break; }
    }
  }
  return r;
}

function doCompare() {
  var c = calc();
  var per = c.per100;
  var resultDiv = document.getElementById('review-result');
  var checked = 0, allOk = true, issues = [];

  for (var i = 0; i < NUTS.length; i++) {
    var it = NUTS[i];
    var cv = per[it.key];
    var cvs = fmt(cv, it.key);
    var inp = document.getElementById('rv-' + it.key);
    var st = document.getElementById('rv-st-' + it.key);
    if (!inp || !st) continue;

    var lv = parseFloat(inp.value);
    if (isNaN(lv) || inp.value.trim() === '') {
      st.textContent = '-'; st.className = '';
      continue;
    }
    checked++;
    var cv2 = parseFloat(cvs);
    var pct = Math.abs(lv - cv2) / Math.max(cv2, 0.1) * 100;
    var diff = (lv - cv2 > 0 ? '+' : '') + (Math.round((lv - cv2) * 10) / 10).toFixed(1);

    if (pct < 5) {
      st.textContent = '通过'; st.className = 'td-sub';
      st.style.color = '#135c3f'; st.style.fontWeight = '700';
    } else if (lv / Math.max(cv2, 0.01) <= 1.2) {
      st.textContent = '合规(' + Math.round(pct) + '%)'; st.className = '';
      st.style.color = '#d46b08';
      issues.push(it.label + '偏差' + Math.round(pct) + '%（在GB 28050允许范围内）');
    } else {
      st.textContent = '超标(' + Math.round(pct) + '%)'; st.className = 'bad';
      st.style.color = '#cf1322'; st.style.fontWeight = '700';
      issues.push(it.label + '：标签' + lv + ' vs 测算' + cvs + '，偏差' + Math.round(pct) + '%');
      allOk = false;
    }
  }

  if (checked < 5) {
    resultDiv.innerHTML = '<div style="text-align:center;padding:16px;color:#888">已填写 ' + checked + '/7 项，请填写全部7项以获取完整审核结果</div>';
  } else if (allOk) {
    resultDiv.innerHTML = '<div style="text-align:center;padding:16px"><span class="pass-stamp">审核通过</span></div>' +
      '<div style="text-align:center;color:#135c3f;font-weight:700;margin-top:8px">标签营养成分与测算值一致，符合GB 28050-2025</div>';
  } else {
    var h = '<div style="text-align:center;padding:16px"><span class="fail-stamp">需整改</span></div>' +
      '<div style="background:#fff1f0;padding:12px;border-radius:4px;margin-top:8px"><strong style="color:#cf1322">问题：</strong><ul style="margin:4px 0 0 20px;font-size:13px">';
    for (var j = 0; j < issues.length; j++) { h += '<li style="color:#a80d1a">' + issues[j] + '</li>'; }
    h += '</ul></div>';
    resultDiv.innerHTML = h;
  }
}

// 全局点击关闭下拉
document.addEventListener('click', function(e) {
  if (!e.target.closest('.rel')) {
    document.querySelectorAll('.drop').forEach(function(d) { d.classList.remove('show'); });
  }
});

// 启动
buildTab1();
</script>
