  var el=g('il');if(!el)return;el.innerHTML='';
  var ns=Object.keys(DB).sort();
  for(var i=0;i<F.items.length;i++){(function(idx){
    var rw=ce('div','rw');rw.style.marginBottom='5px';
    var d1=ce('div','cl rp');d1.style.flex='2';
    var inp=ce('input');inp.value=F.items[idx].n;inp.placeholder='搜索配料...';
    inp.oninput=function(){F.items[idx].n=this.value;sf();sd(this,idx);};
    inp.onfocus=function(){sd(this,idx);};
    var dp=ce('div','dp');dp.id='dp-'+idx;
    d1.appendChild(inp);d1.appendChild(dp);

    var d2=ce('div','cl');d2.style.flex='0 0 90px';
    var wi=ce('input');wi.type='number';wi.value=F.items[idx].w;wi.placeholder='克';wi.step='0.1';
    wi.oninput=function(){F.items[idx].w=parseFloat(this.value)||0;sf();us();rp();};
    d2.appendChild(wi);

    var d3=ce('div');d3.style.flex='0 0 36px';
    var db=ce('button');db.textContent='x';db.className='btn2 btns';
    db.onclick=function(){F.items.splice(idx,1);sf();ri();rp();};
    d3.appendChild(db);

    rw.appendChild(d1);rw.appendChild(d2);rw.appendChild(d3);
    el.appendChild(rw);
  })(i);}
  us();
}

function sd(inp,idx){
  var q=inp.value.toLowerCase(),dp=g('dp-'+idx);if(!dp)return;
  var ns=Object.keys(DB).filter(function(n){return n.toLowerCase().indexOf(q)>=0;}).slice(0,12);
  if(!ns.length||!q){dp.classList.remove('on');return;}
  dp.classList.add('on');dp.innerHTML='';
  for(var i=0;i<ns.length;i++){(function(n){
    var d=ce('div');d.textContent=n+' ['+DB[n].src+']';
    d.onmousedown=function(){F.items[idx].n=n;sf();ri();rp();};
    dp.appendChild(d);
  })(ns[i]);}
}

function us(){
  var el=g('sm');if(!el)return;
  var t=0;for(var i=0;i<F.items.length;i++)t+=F.items[i].w||0;
  el.textContent='合计：'+t.toFixed(1)+'g / 规格：'+F.bag+'g';
  if(t>0&&Math.abs(t-F.bag)<0.1)el.textContent+=' ✓';else if(t>0)el.textContent+=' ⚠ 偏差'+(Math.abs(t-F.bag)).toFixed(1)+'g';
}

function rp(){var el=g('pv');if(!el)return;var c=calc();el.innerHTML=nt(c.per,F.bag);if(c.miss.length)el.innerHTML+='<div style="color:#cf1322;font-size:11px;margin-top:4px">未匹配：'+c.miss.join('、')+'</div>';}

// 粘贴数据
function showPaste(){
  var ov=ce('div');ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:998;display:flex;align-items:center;justify-content:center';
  var md=ce('div');md.style.cssText='background:#fff;border-radius:8px;padding:20px;max-width:550px;width:90%';
  md.innerHTML='<h3 style="margin-bottom:8px">粘贴配料数据</h3><p style="font-size:12px;color:#888;margin-bottom:8px">从 Excel 中复制配料列和重量列（两列），直接粘贴到下方：</p><textarea id="pasteData" class="paste-area" placeholder="配料名1\t重量1\n配料名2\t重量2\n..."></textarea><div class="help">每行一个配料，配料名和重量之间用 Tab 分隔（从 Excel 复制即为该格式）</div><div style="text-align:right;margin-top:12px"><button class="btn4 btns" id="pc">取消</button> <button class="btn1 btns" id="pok">确认导入</button></div>';
  ov.appendChild(md);document.body.appendChild(ov);
  g('pc').onclick=function(){ov.remove();};
  g('pok').onclick=function(){
    var txt=g('pasteData').value.trim();if(!txt){msg('请粘贴数据','er');return;}
    var lines=txt.split('\n'),added=0;
    for(var i=0;i<lines.length;i++){
      var parts=lines[i].split('\t');
      if(parts.length<2)continue;
      var n=parts[0].trim(),w=parseFloat(parts[1]);
      if(n&&!isNaN(w)&&w>0){F.items.push({n:n,w:w});added++;}
    }
    if(added){sf();ri();rp();msg('已导入 '+added+' 个配料','ok');}
    ov.remove();
  };
  ov.onclick=function(e){if(e.target===ov)ov.remove();};
}

// ═══════════════════════════════════════
// Tab 2: 营养成分表
// ═══════════════════════════════════════
function b2(el){
  el.innerHTML='';var c=calc(),b=F.bag,bx=b*BAGS;
  var bx1=ce('div','bx');bx1.innerHTML='<h3>'+(F.name||'（未命名）')+' <span style="font-size:12px;color:#888;font-weight:400">'+b+'g/包 × '+BAGS+'包/盒 = '+bx+'g/盒</span></h3>';
  bx1.innerHTML+=nt(c.per,b);
  if(c.miss.length)bx1.innerHTML+='<div style="color:#cf1322;font-size:12px">未匹配：'+c.miss.join('、')+'</div>';
  el.appendChild(bx1);

  // 预览
  var bx2=ce('div','bx');bx2.innerHTML='<h3>标签预览 <button class="btn1 btns" id="be" style="float:right">导出图片</button></h3>';
  var cv=ce('canvas');cv.id='cv';cv.style.cssText='max-width:100%;border:1px solid #ddd';bx2.appendChild(cv);el.appendChild(bx2);
  draw();
  g('be').onclick=function(){draw();var a=ce('a');a.download=(F.name||'标签')+'.png';a.href=g('cv').toDataURL();a.click();msg('已导出','ok');};
}

function draw(){
  var cv=g('cv');if(!cv)return;var ctx=cv.getContext('2d'),w=600,h=390;
  cv.width=w;cv.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  var c=calc(),per=c.per;
  ctx.fillStyle='#000';ctx.font='bold 18px "Microsoft YaHei",sans-serif';ctx.textAlign='center';
  ctx.fillText(F.name||'产品名称',w/2,35);
  ctx.font='bold 16px "Microsoft YaHei",sans-serif';ctx.fillText('营养成分表',w/2,58);
  var y=90;
  ctx.font='bold 13px "Microsoft YaHei",sans-serif';
  ['项目','每100克','NRV%'].forEach(function(t,i){ctx.fillText(t,[40,280,420][i]+[240,140,140][i]/2,y+20);});
  y+=34;ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-40,y);ctx.stroke();
  ctx.font='12px "Microsoft YaHei",sans-serif';
  for(var i=0;i<NUTS.length;i++){
    y+=30;var it=NUTS[i],v=per[it.k],vs=it.k==='na'?Math.round(v)+'':(it.k==='e'?Math.round(v)+'':v.toFixed(1)),nr=np(v,it.k);
    ctx.textAlign='left';ctx.fillStyle='#333';ctx.fillText((it.s?'  ':'')+it.n,48,y+20);
    ctx.textAlign='center';ctx.fillText(vs+' '+it.u,350,y+20);ctx.fillText(nr,490,y+20);
    ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(40,y+30);ctx.lineTo(w-40,y+30);ctx.stroke();
  }
  y+=40;ctx.font='10px "Microsoft YaHei",sans-serif';ctx.fillStyle='#888';ctx.textAlign='center';
  ctx.fillText('儿童青少年应避免过量摄入盐油糖。',w/2,y);
}

// ═══════════════════════════════════════
// Tab 3: 标签检查
// ═══════════════════════════════════════
function b3(el){
  el.innerHTML='';var c=calc(),per=c.per,rs=[],its=F.items.filter(function(x){return x.w>0;});
  rs.push({ok:true,t:'✓ 7项强制标示完整（能量、蛋白质、脂肪、饱和脂肪、碳水、糖、钠）'});
  if(c.miss.length){rs.push({ok:false,t:'✗ 原料未匹配：'+c.miss.join('、')});}
  else{rs.push({ok:true,t:'✓ '+its.length+'种配料全部匹配数据库'});}
  var ag=[];
  for(var i=0;i<its.length;i++){for(var ct in ALG){for(var j=0;j<ALG[ct].length;j++){if(its[i].n.indexOf(ALG[ct][j])>=0&&ag.indexOf(ct)<0)ag.push(ct);}}}
  if(ag.length){rs.push({ok:false,t:'✗ 含强制致敏物质，配料表中对应原料需加粗标示（GB 7718-2025）'});}
  else{rs.push({ok:true,t:'✓ 未检出强制致敏物质'});}
  var ws=its.map(function(x){return x.w;}),ss=ws.slice().sort(function(a,b){return b-a;});
  rs.push({ok:ws.every(function(w,i){return w===ss[i];}),t:ws.every(function(w,i){return w===ss[i];})?'✓ 配料按添加量递减排列':'✗ 配料未按添加量递减排列”GB 7718要求“'});
  rs.push({ok:true,t:'✓ 强制声明语：“儿童青少年应避免过量摄入盐油糖。”'});
  if(per.e>2000)rs.push({ok:false,t:'⚠ 能量'+per.e+'kJ 偏高'});
  if(per.f>30)rs.push({ok:false,t:'⚠ 脂肪'+per.f+'g 偏高 (NRV '+np(per.f,'f')+')'});
  if(per.sg>40)rs.push({ok:false,t:'⚠ 糖'+per.sg+'g 偏高'});
  if(per.na>500)rs.push({ok:false,t:'⚠ 钠'+per.na+'mg 偏高'});

  var bx=ce('div','bx');bx.innerHTML='<h3>标签合规检查 — '+(F.name||'当前产品')+'</h3>';
  var ul=ce('ul');ul.style.cssText='list-style:none;padding:0';var ok=0,no=0;
  for(var i=0;i<rs.length;i++){
    var li=ce('li');li.style.cssText='padding:7px 10px;margin:3px 0;border-radius:3px;font-size:13px;border-left:4px solid '+(rs[i].ok?'#135c3f':'#cf1322');
    li.style.background=rs[i].ok?'#f0faf4':'#fff1f0';li.style.color=rs[i].ok?'#135c3f':'#a80d1a';
    li.textContent=rs[i].t;ul.appendChild(li);if(rs[i].ok)ok++;else no++;
  }
  bx.appendChild(ul);
  bx.innerHTML+='<div style="margin-top:10px;padding:8px 10px;background:#f5f5f5;border-radius:4px;font-size:12px">通过 <b style="color:#135c3f">'+ok+'</b> 项'+(no>0?'，不通过 <b style="color:#cf1322">'+no+'</b> 项':'')+'</div>';
  el.appendChild(bx);
}

// ═══════════════════════════════════════
// Tab 4: 标签审核
// ═══════════════════════════════════════
var RIMG=null;

function b4(el){
  el.innerHTML='';var c=calc();
  // 上传图
  var bx1=ce('div','bx');bx1.innerHTML='<h3>步骤一：上传标签图片</h3>';
  var ub=ce('div','upbox');ub.id='ub';var fi=ce('input');fi.type='file';fi.accept='image/*';fi.style.display='none';fi.id='rfi';
  ub.appendChild(fi);
  if(RIMG){var im=ce('img');im.src=RIMG;ub.appendChild(im);ub.innerHTML+='<div style="margin-top:6px"><button class="btn4 btns" id="bci">更换图片</button></div>';}
  else{ub.innerHTML+='<div style="font-size:40px;color:#ccc;margin-bottom:6px">📷</div><div style="color:#888">点击上传产品标签照片</div><div style="color:#bbb;font-size:11px;margin-top:4px">拍摄营养成分表区域，确保文字清晰</div>';}
  ub.onclick=function(e){if(e.target.tagName==='BUTTON')return;g('rfi').click();};
  bx1.appendChild(ub);el.appendChild(bx1);

  // 对比表
  var bx2=ce('div','bx');bx2.innerHTML='<h3>步骤二：手动输入标签值并对比</h3><p style="font-size:12px;color:#666;margin-bottom:8px">对照标签图片，手动输入营养成分表中的数值，系统自动对比</p>';
  var tb=ce('table');tb.innerHTML='<thead><tr><th>项目</th><th>测算值</th><th>标签值（手动输入）</th><th>判定</th></tr></thead><tbody id="rtb"></tbody>';
  var tbd=tb.querySelector('#rtb');
  for(var i=0;i<NUTS.length;i++){
    var it=NUTS[i],cv=c.per[it.k],cvs=fm(cv,it.k);
    var tr=ce('tr');
    tr.innerHTML='<td class="tl">'+it.n+'</td><td>'+cvs+' '+it.u+'</td><td><input type="text" id="rv-'+it.k+'" placeholder="输入标签值" style="width:100px"> <span style="font-size:10px;color:#888">'+it.u+'</span></td><td id="rs-'+it.k+'" style="font-size:11px">-</td>';
    tbd.appendChild(tr);
    g('rv-'+it.k).oninput=cmp;
  }
  bx2.appendChild(tb);
  var bc=ce('button');bc.textContent='执行审核对比';bc.className='btn3';bc.style.cssText='width:100%;margin-top:10px';bc.onclick=cmp;
  bx2.appendChild(bc);
  var rd=ce('div');rd.id='rd';rd.style.marginTop='12px';bx2.appendChild(rd);
  el.appendChild(bx2);

  g('rfi').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(ev){RIMG=ev.target.result;b4(el);};r.readAsDataURL(f);
  };
  if(g('bci'))g('bci').onclick=function(e){e.stopPropagation();g('rfi').click();};
}

function cmp(){
  var c=calc(),per=c.per,rd=g('rd'),ck=0,ok=true,is=[];
  for(var i=0;i<NUTS.length;i++){
    var it=NUTS[i],cv=per[it.k],cvs=fm(cv,it.k),inp=g('rv-'+it.k),st=g('rs-'+it.k);
    if(!inp||!st)continue;
    var lv=parseFloat(inp.value);if(isNaN(lv)||inp.value.trim()===''){st.textContent='-';st.style.color='';continue;}
    ck++;var cv2=parseFloat(cvs),pct=Math.abs(lv-cv2)/Math.max(cv2,.1)*100;
    if(pct<5){st.textContent='通过';st.style.color='#135c3f';st.style.fontWeight='700';}
    else if(lv/Math.max(cv2,.01)<=1.2){st.textContent='合规('+Math.round(pct)+'%)';st.style.color='#d46b08';is.push(it.n+'偏差'+Math.round(pct)+'%（GB 28050允许范围内）');}
    else{st.textContent='超标('+Math.round(pct)+'%)';st.style.color='#cf1322';st.style.fontWeight='700';is.push(it.n+'：标签'+lv+' vs 测算'+cvs+'，偏差'+Math.round(pct)+'%');ok=false;}
  }
  if(ck<5){rd.innerHTML='<div style="text-align:center;padding:14px;color:#888">已填写 '+ck+'/7 项，请填写全部7项</div>';}
  else if(ok){rd.innerHTML='<div style="text-align:center;padding:14px"><span class="st-ok">审核通过</span></div><div style="text-align:center;color:#135c3f;font-weight:700;margin-top:6px">标签营养成分与测算值一致，符合GB 28050-2025</div>';}
  else{var h='<div style="text-align:center;padding:14px"><span class="st-no">需整改</span></div><div style="background:#fff1f0;padding:10px;border-radius:4px;margin-top:6px"><strong style="color:#cf1322">问题：</strong><ul style="margin:3px 0 0 18px;font-size:12px">';for(var j=0;j<is.length;j++)h+='<li style="color:#a80d1a">'+is[j]+'</li>';h+='</ul></div>';rd.innerHTML=h;}
}

// ═══════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════
function g(id){return document.getElementById(id);}
function ce(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e;}

// Tab 切换
document.querySelectorAll('.nv a').forEach(function(a){
  a.onclick=function(){
    document.querySelectorAll('.nv a').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('.tb').forEach(function(x){x.classList.remove('on');});
    this.classList.add('on');var t=this.dataset.t;
    var el=g(t);el.classList.add('on');
    if(t==='t1')b1(el);if(t==='t2')b2(el);if(t==='t3')b3(el);if(t==='t4')b4(el);
  };
});

// 点击关闭下拉
document.addEventListener('click',function(e){if(!e.target.closest('.rp')){document.querySelectorAll('.dp').forEach(function(d){d.classList.remove('on');})}})

// 启动
lf();b1(g('t1'));
</script>
</body>
</html>
